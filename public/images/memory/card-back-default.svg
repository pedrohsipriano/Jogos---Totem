<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-back" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="accent-back" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <pattern id="grid-pattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <filter id="glow-back" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ffffff" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Card Body -->
  <rect width="200" height="200" rx="28" fill="url(#bg-back)"/>
  <rect width="200" height="200" rx="28" fill="url(#grid-pattern)"/>
  
  <!-- Outer Border -->
  <rect x="10" y="10" width="180" height="180" rx="20" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  <rect x="16" y="16" width="168" height="168" rx="16" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Center Emblem: Futuristic Geometric Diamond -->
  <g filter="url(#glow-back)">
    <!-- Outer diamond -->
    <rect x="75" y="75" width="50" height="50" rx="10" fill="none" stroke="url(#accent-back)" stroke-width="2.5" transform="rotate(45 100 100)"/>
    <!-- Inner diamond -->
    <rect x="85" y="85" width="30" height="30" rx="6" fill="none" stroke="url(#accent-back)" stroke-width="1.5" transform="rotate(45 100 100)"/>
    <!-- Core dot -->
    <circle cx="100" cy="100" r="5" fill="#ffffff"/>
  </g>

  <!-- Corner accents -->
  <circle cx="28" cy="28" r="2.5" fill="rgba(255,255,255,0.4)"/>
  <circle cx="172" cy="28" r="2.5" fill="rgba(255,255,255,0.4)"/>
  <circle cx="28" cy="172" r="2.5" fill="rgba(255,255,255,0.4)"/>
  <circle cx="172" cy="172" r="2.5" fill="rgba(255,255,255,0.4)"/>
</svg>
