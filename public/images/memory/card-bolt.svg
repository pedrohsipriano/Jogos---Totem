<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#422006"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
    <linearGradient id="bolt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="shadow-bolt" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#facc15" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="28" fill="url(#bg-bolt)"/>
  <rect x="2" y="2" width="196" height="196" rx="26" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  
  <g filter="url(#shadow-bolt)">
    <polygon points="106,36 62,106 100,106 88,168 138,94 102,94" fill="url(#bolt-grad)"/>
    <!-- Edge shine -->
    <polygon points="106,36 84,106 100,106 94,136 138,94 102,94" fill="#ffffff" opacity="0.3"/>
  </g>
</svg>
