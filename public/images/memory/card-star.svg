<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="star-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="shadow-star" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#facc15" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="28" fill="url(#bg-star)"/>
  <rect x="2" y="2" width="196" height="196" rx="26" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  
  <g filter="url(#shadow-star)">
    <!-- 5-Point Star -->
    <polygon points="100,38 116,78 158,80 124,108 136,150 100,126 64,150 76,108 42,80 84,78" fill="url(#star-grad)"/>
    <!-- Star Facet 3D Shading -->
    <polygon points="100,38 100,126 64,150 76,108 42,80 84,78" fill="#ca8a04" opacity="0.35"/>
    <circle cx="100" cy="100" r="10" fill="#ffffff" opacity="0.3"/>
  </g>
</svg>
