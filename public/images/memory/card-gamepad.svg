<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-gamepad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="pad-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow-gamepad" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Card Background -->
  <rect width="200" height="200" rx="28" fill="url(#bg-gamepad)"/>
  <rect x="2" y="2" width="196" height="196" rx="26" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  
  <!-- Gamepad Shape -->
  <g filter="url(#shadow-gamepad)">
    <path d="M50 82 C50 68, 65 65, 80 65 L120 65 C135 65, 150 68, 150 82 C150 95, 160 125, 145 140 C132 153, 115 135, 100 135 C85 135, 68 153, 55 140 C40 125, 50 95, 50 82 Z" fill="url(#pad-body)"/>
    <!-- D-pad Left -->
    <path d="M72 85 L78 85 L78 91 L84 91 L84 97 L78 97 L78 103 L72 103 L72 97 L66 97 L66 91 L72 91 Z" fill="#ffffff" opacity="0.9"/>
    <!-- Action Buttons Right -->
    <circle cx="122" cy="89" r="4" fill="#38bdf8"/>
    <circle cx="130" cy="97" r="4" fill="#f43f5e"/>
    <circle cx="114" cy="97" r="4" fill="#10b981"/>
    <circle cx="122" cy="105" r="4" fill="#fbbf24"/>
    <!-- Center Grip -->
    <circle cx="92" cy="112" r="6" fill="#312e81"/>
    <circle cx="108" cy="112" r="6" fill="#312e81"/>
  </g>
</svg>
