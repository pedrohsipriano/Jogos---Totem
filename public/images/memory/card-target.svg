<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-target" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="shadow-target" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="28" fill="url(#bg-target)"/>
  <rect x="2" y="2" width="196" height="196" rx="26" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  
  <g filter="url(#shadow-target)">
    <!-- Outer ring -->
    <circle cx="100" cy="100" r="54" fill="#ffffff"/>
    <circle cx="100" cy="100" r="42" fill="#ef4444"/>
    <circle cx="100" cy="100" r="30" fill="#ffffff"/>
    <circle cx="100" cy="100" r="18" fill="#ef4444"/>
    <circle cx="100" cy="100" r="6" fill="#facc15"/>
    
    <!-- Crosshairs -->
    <line x1="100" y1="36" x2="100" y2="48" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="100" y1="152" x2="100" y2="164" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="36" y1="100" x2="48" y2="100" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="152" y1="100" x2="164" y2="100" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
