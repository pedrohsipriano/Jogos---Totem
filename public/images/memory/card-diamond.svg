<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-diamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="cyan-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="cyan-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="shadow-diamond" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="28" fill="url(#bg-diamond)"/>
  <rect x="2" y="2" width="196" height="196" rx="26" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  
  <g filter="url(#shadow-diamond)">
    <!-- Top facets -->
    <polygon points="68,60 132,60 152,85 48,85" fill="url(#cyan-light)"/>
    <!-- Top center triangle -->
    <polygon points="82,60 118,60 100,85" fill="#ffffff" opacity="0.6"/>
    <!-- Bottom facets -->
    <polygon points="48,85 100,85 100,146" fill="url(#cyan-dark)"/>
    <polygon points="152,85 100,85 100,146" fill="url(#cyan-light)"/>
    <!-- Sparkles -->
    <circle cx="140" cy="55" r="3" fill="#ffffff"/>
    <circle cx="58" cy="115" r="2" fill="#ffffff"/>
  </g>
</svg>
